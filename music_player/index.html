<!DOCTYPE html>

<html lang="NL">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BeatLy</title>
    <link rel="stylesheet" href="base.css">
</head>
<body>
    <main class="player">
        <h1>BeatLy</h1>

        <section class="song">
            <h2 id="song-title">Geen nummer geselecteerd</h2>
            <p id="artist"> Kies een muziekbestand</p>
        </section>


        <input type="file" id="file-picker" accept="audio/*">
        <audio id="audio-player"></audio>

        <div class="controls">
            <button id="previous">
                <img src="static/images/back.svg">
            </button>
            <button id="play">
                <img src="static/images/play.svg">
            </button>
            <button id="next">
                <img src="static/images/next.svg"
            </button>
        </div>

        <input id="progress" type="range"
               min="0" max="100" value="0">

        <label for="volume">Volume</label>
        <input id="volume" type="range"
               min="0" max="1" step="0.01" value="1">
    </main>
    <script src="player.js"></script>
</body>
</html>
